name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 shellcheck
      - run: bash -n scripts/deploy.sh deploy/*.sh && shellcheck scripts/deploy.sh deploy/*.sh
      - run: npm run check
      - run: npm test
